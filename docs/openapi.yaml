openapi: 3.1.0

info:
  title: PayMux API
  version: "1.0.0"
  summary: Open-source payment gateway multiplexer and webhook router.
  description: |
    PayMux lets several applications share one payment gateway account. Each
    application authenticates with its own API key, which is what determines
    ownership: PayMux never trusts an application identifier supplied in a
    request body.

    **Amounts** are integers in the currency's minor unit. For IDR that is one
    rupiah, so `150000` means Rp 150.000.

    **Identifiers** are prefixed, sortable ULIDs: `pay_…` for payments,
    `evt_…` for events, `dlv_…` for deliveries.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: PayMux
    url: https://github.com/Javapixa-Creative-Studio/PayMux

servers:
  - url: https://paymux.example.com
    description: Your PayMux deployment
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: Payments
    description: Creating payments and acting on them.
  - name: Refunds
    description: Full and partial refunds.
  - name: Subscriptions
    description: Recurring billing, where the merchant account has it activated.
  - name: Payouts
    description: |
      Paying money out. Off until the gateway account holds disbursement
      credentials and the application has been permitted to disburse.
  - name: Events
    description: The normalized events PayMux publishes.
  - name: Deliveries
    description: Webhook delivery attempts and replays.
  - name: Gateway
    description: Gateway capabilities and notification callbacks.
  - name: System
    description: Liveness and readiness.

paths:
  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Create a payment
      description: |
        Opens a payment at the gateway and returns the checkout token and
        redirect URL. Send an `Idempotency-Key` so a retried request returns
        the original payment instead of opening a second transaction.
      operationId: createPayment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
            examples:
              snap:
                summary: A Snap payment
                value:
                  application_order_id: INV-000123
                  amount: 150000
                  currency: IDR
                  customer:
                    first_name: John
                    last_name: Doe
                    email: john@example.com
                    phone: "+628123456789"
                  items:
                    - id: PROD-001
                      name: Example Product
                      price: 150000
                      quantity: 1
      responses:
        "201":
          description: The payment was created.
          headers:
            Idempotent-Replay:
              description: Present and `true` when this is a replayed response.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/GatewayNotConfigured" }

    get:
      tags: [Payments]
      summary: List payments
      description: Returns the calling application's payments, newest first.
      operationId: listPayments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
        - name: application_order_id
          in: query
          schema: { type: string }
        - name: created_from
          in: query
          schema: { type: string, format: date-time }
        - name: created_to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/payments/{paymentId}:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    get:
      tags: [Payments]
      summary: Retrieve a payment
      description: |
        Returns PayMux's stored state, which is updated by gateway
        notifications. Use `/sync` to force a read from the gateway.
      operationId: getPayment
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/payments/{paymentId}/sync:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      summary: Sync a payment with the gateway
      description: |
        Reads the gateway's authoritative state and applies it. A state that
        would move the payment backwards is recorded and ignored.
      operationId: syncPayment
      responses:
        "200":
          description: The reconciled payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/GatewayError" }

  /api/v1/payments/{paymentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      summary: Cancel a payment
      description: Cancels a payment that has not settled.
      operationId: cancelPayment
      responses:
        "200":
          description: The cancelled payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The payment can no longer be cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/payments/{paymentId}/expire:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      summary: Expire a payment
      operationId: expirePayment
      responses:
        "200":
          description: The expired payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/payments/{paymentId}/snap/cancel:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Payments]
      summary: Cancel the checkout session
      description: |
        Retires the Snap checkout session so its token can no longer be paid.
        Midtrans has no endpoint that revokes a token on its own, so PayMux
        expires the underlying transaction, which has the same effect.
      operationId: cancelCheckoutSession
      responses:
        "200":
          description: The payment after the session was retired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/payments/{paymentId}/refunds:
    parameters:
      - $ref: "#/components/parameters/PaymentId"
    post:
      tags: [Refunds]
      summary: Refund a payment
      description: |
        Refunds part or all of a settled payment. Omit `amount` to refund the
        remaining balance. An `Idempotency-Key` doubles as the refund key, so a
        retried request cannot refund twice.
      operationId: createRefund
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRefundRequest" }
      responses:
        "201":
          description: The refund.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The payment cannot be refunded, or the amount exceeds the balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [Refunds]
      summary: List a payment's refunds
      operationId: listRefunds
      responses:
        "200":
          description: The refunds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/refunds:
    get:
      tags: [Refunds]
      summary: List refunds
      description: |
        Refunds across every payment the calling application owns. A payment's
        own refunds are also available on its detail endpoint.
      operationId: listAllRefunds
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        - name: payment_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of refunds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/subscriptions:
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: |
        Requires a gateway payment token; PayMux never handles raw card
        details. Recurring billing must be activated on the merchant account,
        if it is not, the gateway's refusal is returned unchanged.
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubscriptionRequest" }
      responses:
        "201":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400":
          description: The gateway does not support subscriptions for this account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

    get:
      tags: [Subscriptions]
      summary: List subscriptions
      operationId: listSubscriptions
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
      responses:
        "200":
          description: A page of subscriptions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    get:
      tags: [Subscriptions]
      summary: Retrieve a subscription
      operationId: getSubscription
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Subscriptions]
      summary: Update a subscription
      operationId: updateSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSubscriptionRequest" }
      responses:
        "200":
          description: The updated subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/subscriptions/{subscriptionId}/enable:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags: [Subscriptions]
      summary: Enable a subscription
      operationId: enableSubscription
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/subscriptions/{subscriptionId}/disable:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags: [Subscriptions]
      summary: Disable a subscription
      operationId: disableSubscription
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/subscriptions/{subscriptionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SubscriptionId"
    post:
      tags: [Subscriptions]
      summary: Cancel a subscription
      operationId: cancelSubscription
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/beneficiaries:
    post:
      tags: [Payouts]
      summary: Register a payout destination
      description: |
        A payout names a beneficiary rather than an account number, so a
        destination is reviewed once and reused. Aliases are unique within an
        application.
      operationId: createBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBeneficiaryRequest" }
      responses:
        "201":
          description: The beneficiary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Beneficiary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: An alias already in use by this application.
    get:
      tags: [Payouts]
      summary: List payout destinations
      operationId: listBeneficiaries
      responses:
        "200":
          description: A page of beneficiaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Beneficiary" }
                  has_more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/beneficiaries/{beneficiaryId}:
    parameters:
      - name: beneficiaryId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Payouts]
      summary: Read a payout destination
      operationId: getBeneficiary
      responses:
        "200":
          description: The beneficiary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Beneficiary" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Payouts]
      summary: Change a payout destination
      description: |
        Editing the account number or bank clears any verification: the
        confirmation was about the old number and says nothing about the new
        one.
      operationId: updateBeneficiary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                account: { type: string }
                bank: { type: string }
                email: { type: string }
                disabled: { type: boolean }
      responses:
        "200":
          description: The updated beneficiary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Beneficiary" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Payouts]
      summary: Remove a payout destination
      description: |
        Refused while payouts still reference it: the record is part of the
        history of where money went.
      operationId: deleteBeneficiary
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/beneficiaries/{beneficiaryId}/verify:
    parameters:
      - name: beneficiaryId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Payouts]
      summary: Ask the bank who owns this account
      description: |
        The last point at which a wrong account number is still cheap. The
        bank's answer is recorded rather than judged: names differ legitimately,
        so compare it yourself before sending money.
      operationId: verifyBeneficiary
      responses:
        "200":
          description: The beneficiary, with the name the bank holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Beneficiary" }
        "412":
          description: The gateway account has no disbursement credentials.
        "422":
          description: The gateway could not confirm the account.

  /api/v1/payout-banks:
    get:
      tags: [Payouts]
      summary: List valid beneficiary banks
      description: |
        Bank codes are the gateway's vocabulary, not PayMux's. Use `gopay` or
        `ovo` with a phone number to pay an e-wallet.
      operationId: listPayoutBanks
      responses:
        "200":
          description: The banks this gateway can pay out to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: bni }
                        name: { type: string, example: Bank Negara Indonesia }
        "412":
          description: The gateway account has no disbursement credentials.

  /api/v1/payouts:
    post:
      tags: [Payouts]
      summary: Request a payout
      description: |
        Money leaving the merchant balance. Refused unless the gateway account
        holds disbursement credentials and the application has been permitted
        to disburse, both of which are off by default.

        Answers `202` when the payout awaits approval, because nothing has been
        sent; `201` only when the application is configured to skip approval.

        Reusing `application_payout_id` returns the original payout. That is the
        mechanism rather than a convenience: a client retrying a request whose
        answer it never saw must not later discover it sent the money twice.
      operationId: createPayout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayoutRequest" }
      responses:
        "201":
          description: Released without approval, and queued for submission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "202":
          description: Recorded and awaiting approval. Nothing has been sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: This application is not permitted to disburse.
        "412":
          description: The gateway account has no disbursement credentials.
        "422":
          description: Over a per-payout or daily limit, or the beneficiary is disabled.
    get:
      tags: [Payouts]
      summary: List this application's payouts
      operationId: listPayouts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [REQUESTED, APPROVED, SUBMITTED, UNRESOLVED, COMPLETED, FAILED, REJECTED]
      responses:
        "200":
          description: A page of payouts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Payout" }
                  has_more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/payouts/{payoutId}:
    parameters:
      - name: payoutId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Payouts]
      summary: Read a payout
      operationId: getPayout
      responses:
        "200":
          description: The payout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/events:
    get:
      tags: [Events]
      summary: List events
      description: Returns the events PayMux published for this application.
      operationId: listEvents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/EventType" }
        - name: payment_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/deliveries:
    get:
      tags: [Deliveries]
      summary: List webhook deliveries
      operationId: listDeliveries
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/StartingAfter"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/DeliveryState" }
        - name: event_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/deliveries/{deliveryId}/retry:
    parameters:
      - name: deliveryId
        in: path
        required: true
        schema: { type: string, example: dlv_01ARZ3NDEKTSV4RRFFQ69G5FAV }
    post:
      tags: [Deliveries]
      summary: Retry a delivery
      description: |
        Requeues a delivery for immediate re-attempt with a fresh attempt
        budget. A delivery a worker is mid-attempt on cannot be retried.
      operationId: retryDelivery
      responses:
        "200":
          description: The requeued delivery.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The delivery is being attempted right now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/gateway/capabilities:
    get:
      tags: [Gateway]
      summary: Report gateway capabilities
      description: |
        What the configured gateway account can actually do. Availability
        depends on merchant configuration, so capabilities are reported rather
        than assumed.
      operationId: getCapabilities
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admin/api/gateways/accounts/{accountId}/test:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string, example: gwa_01ARZ3NDEKTSV4RRFFQ69G5FAV }
    post:
      tags: [Gateway]
      summary: Test a gateway account's credentials
      description: |
        Checks whether the stored credentials can reach the gateway, and
        records the outcome against the account.

        The check asks the gateway for a transaction that cannot exist: an
        answer of "no such transaction" proves the credentials were accepted,
        without leaving anything behind in the merchant's account.

        This is an administrator endpoint and needs a dashboard session, not an
        API key.
      operationId: testGatewayAccount
      security: []
      responses:
        "200":
          description: The account, with the check's outcome recorded on it.
        "401":
          description: Authentication is required.
        "404":
          description: No such gateway account.

  /webhooks/midtrans:
    post:
      tags: [Gateway]
      summary: Midtrans payment notification
      description: |
        The URL to configure as the merchant's Payment Notification URL.

        This endpoint is outside the application API's authentication: it is
        authenticated by Midtrans's own signature instead. PayMux acknowledges
        as soon as the notification is recorded and the payment updated;
        delivery to the owning application happens asynchronously.
      operationId: midtransNotification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Midtrans transaction notification.
              additionalProperties: true
      responses:
        "200":
          description: Processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  routed: { type: boolean }
                  status: { type: string }
        "202":
          description: |
            Authentic, but it matches no payment PayMux created. It is stored
            for an operator to inspect rather than discarded.
        "401":
          description: The signature could not be verified.

  /health:
    get:
      tags: [System]
      summary: Liveness
      description: Reports process health without touching any dependency.
      operationId: health
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: "1.0.0" }

  /ready:
    get:
      tags: [System]
      summary: Readiness
      description: Reports whether PayMux can serve traffic, including the database.
      operationId: ready
      security: []
      responses:
        "200":
          description: Ready.
        "503":
          description: A dependency is unavailable.

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: |
        An application API key: `Authorization: Bearer pmx_live_…`.

        The key determines which application the request acts as. A `pmx_test_…`
        key works only against a sandbox gateway account, and a `pmx_live_…` key
        only against production.

  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, example: pay_01ARZ3NDEKTSV4RRFFQ69G5FAV }

    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string, example: sub_01ARZ3NDEKTSV4RRFFQ69G5FAV }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Makes the request safe to retry. The same key with the same body
        returns the original result; the same key with a different body is
        rejected as a conflict. Keys are remembered for 24 hours.
      schema: { type: string, maxLength: 255 }

    Limit:
      name: limit
      in: query
      description: Page size, 1–100. Defaults to 25.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

    StartingAfter:
      name: starting_after
      in: query
      description: Return the page following this identifier.
      schema: { type: string }

  responses:
    Unauthorized:
      description: The API key is missing, invalid, revoked or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such resource. Also returned when the resource belongs to another
        application, so identifiers cannot be probed across tenants.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: The request is well formed but contains invalid values.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayError:
      description: The gateway rejected the request or is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GatewayNotConfigured:
      description: No gateway account is configured for this application.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable, machine-readable identifier.
              examples: [PAYMENT_NOT_FOUND, VALIDATION_FAILED, RATE_LIMITED]
            message:
              type: string
              description: A human-readable explanation, safe to display.
            fields:
              type: array
              description: Which fields were invalid, when applicable.
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            request_id:
              type: string
              description: Quote this when reporting a problem.
              example: req_01ARZ3NDEKTSV4RRFFQ69G5FAV

    PaymentStatus:
      type: string
      description: PayMux's normalized payment status.
      enum:
        - PENDING
        - AUTHORIZED
        - PAID
        - FAILED
        - CANCELED
        - EXPIRED
        - REFUNDED
        - PARTIALLY_REFUNDED

    EventType:
      type: string
      enum:
        - payment.created
        - payment.pending
        - payment.authorized
        - payment.paid
        - payment.failed
        - payment.canceled
        - payment.expired
        - payment.refunded
        - payment.partially_refunded
        - refund.created
        - refund.completed
        - refund.failed
        - subscription.created
        - subscription.updated
        - subscription.enabled
        - subscription.disabled
        - subscription.canceled
        - payout.requested
        - payout.approved
        - payout.rejected
        - payout.submitted
        - payout.completed
        - payout.failed

    DeliveryState:
      type: string
      enum: [pending, delivering, succeeded, failed, dead, canceled]

    Customer:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        billing_address: { $ref: "#/components/schemas/Address" }
        shipping_address: { $ref: "#/components/schemas/Address" }

    Address:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        postal_code: { type: string }
        country_code: { type: string }

    Item:
      type: object
      required: [name, price, quantity]
      properties:
        id: { type: string, description: Your own SKU. }
        name: { type: string, maxLength: 50 }
        price:
          type: integer
          format: int64
          description: Unit price in the currency's minor unit.
        quantity: { type: integer, minimum: 1 }
        category: { type: string }
        merchant_name: { type: string }
        url: { type: string }

    GatewayOptions:
      type: object
      description: |
        Gateway-specific parameters, namespaced by gateway. Fields are
        validated; unknown fields are rejected rather than forwarded.
      properties:
        midtrans:
          type: object
          properties:
            credit_card:
              type: object
              properties:
                secure:
                  type: boolean
                  default: true
                  description: 3-D Secure. On unless deliberately disabled.
                bank: { type: string }
                channel: { type: string }
                save_card: { type: boolean }
            bank_transfer:
              type: object
              properties:
                bank:
                  type: string
                  enum: [bca, bni, bri, permata, cimb, mandiri, danamon, maybank, mega]
                va_number: { type: string }
                recipient_name: { type: string }
            gopay:
              type: object
              properties:
                enable_callback: { type: boolean }
                callback_url: { type: string }
            shopeepay:
              type: object
              properties:
                callback_url: { type: string }
            cstore:
              type: object
              properties:
                store: { type: string, enum: [indomaret, alfamart] }
                message: { type: string }
            page_expiry_minutes: { type: integer, minimum: 0 }
            error_redirect_url: { type: string }

    CreatePaymentRequest:
      type: object
      required: [application_order_id, amount]
      properties:
        application_order_id:
          type: string
          maxLength: 128
          description: |
            Your own order reference. Unique within your application only,
            two applications may both use `INV-001`.
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Total in the currency's minor unit.
        currency: { type: string, default: IDR }
        customer: { $ref: "#/components/schemas/Customer" }
        items:
          type: array
          description: Line items. If present, they must sum to `amount`.
          items: { $ref: "#/components/schemas/Item" }
        enabled_payment_methods:
          type: array
          description: |
            Restrict the channels offered. Omit to use whatever the merchant
            account has activated.
          items: { type: string }
          example: [gopay, bca_va, bni_va]
        expires_at: { type: string, format: date-time }
        callback_url:
          type: string
          description: Where the gateway returns the payer after checkout.
        custom_fields:
          type: array
          maxItems: 3
          items: { type: string }
        metadata:
          type: object
          description: Your own data, stored and echoed back in events.
          additionalProperties: true
        gateway: { type: string, default: midtrans }
        gateway_options: { $ref: "#/components/schemas/GatewayOptions" }

    Payment:
      type: object
      properties:
        id: { type: string, example: pay_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: payment }
        application_id: { type: string }
        gateway: { type: string, example: midtrans }
        application_order_id: { type: string }
        gateway_order_id:
          type: string
          description: PayMux's globally unique order id, sent to the gateway.
        gateway_transaction_id: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        gateway_status:
          type: string
          description: The gateway's own status, kept alongside the normalized one.
          example: settlement
        fraud_status: { type: string }
        payment_type: { type: string }
        payment_method: { type: string }
        snap_token: { type: string }
        redirect_url: { type: string }
        refunded_amount: { type: integer, format: int64 }
        refundable_amount: { type: integer, format: int64 }
        metadata: { type: object, additionalProperties: true }
        customer: { $ref: "#/components/schemas/Customer" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        expires_at: { type: [string, "null"], format: date-time }
        paid_at: { type: string, format: date-time }
        canceled_at: { type: string, format: date-time }
        expired_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRefundRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. Omit or send 0 to refund the remaining balance.
        reason: { type: string, maxLength: 255 }

    Refund:
      type: object
      properties:
        id: { type: string, example: rfd_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: refund }
        payment_id: { type: string }
        gateway_refund_id: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        reason: { type: string }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED] }
        gateway_status: { type: string }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Beneficiary:
      type: object
      properties:
        id: { type: string, example: ben_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: beneficiary }
        application_id: { type: string }
        alias:
          type: string
          description: Your own handle for this destination, unique within your application.
          example: supplier-a
        name: { type: string, example: PT Supplier A }
        account:
          type: string
          description: A bank account number, or a phone number for an e-wallet.
          example: "1172993826"
        bank:
          type: string
          description: A bank code, or `gopay` / `ovo`.
          example: bni
        email: { type: string }
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the bank last confirmed this account exists.
        verified_name:
          type: string
          description: |
            The name the bank holds for the account, recorded verbatim. It is
            not compared automatically: names differ legitimately, and whether
            two of them are the same person is a judgement.
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateBeneficiaryRequest:
      type: object
      required: [alias, name, account, bank]
      properties:
        alias: { type: string, example: supplier-a }
        name: { type: string, example: PT Supplier A }
        account: { type: string, example: "1172993826" }
        bank: { type: string, example: bni }
        email: { type: string }
        metadata: { type: object, additionalProperties: true }

    CreatePayoutRequest:
      type: object
      required: [application_payout_id, amount]
      properties:
        application_payout_id:
          type: string
          description: |
            Your own reference, unique within your application. Reusing one
            returns the original payout rather than making a second.
          example: PO-2026-0042
        beneficiary_alias:
          type: string
          description: Your handle for the destination. Supply this or `beneficiary_id`.
          example: supplier-a
        beneficiary_id: { type: string }
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Minor units. For IDR that is whole rupiah.
          example: 250000
        currency: { type: string, default: IDR }
        notes:
          type: string
          maxLength: 100
          description: |
            Rides along to the beneficiary's statement. Banks restrict the
            characters they accept, so PayMux sanitises rather than refusing
            the payout.
        metadata: { type: object, additionalProperties: true }

    Payout:
      type: object
      properties:
        id: { type: string, example: pyo_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: payout }
        application_id: { type: string }
        application_payout_id: { type: string }
        gateway: { type: string, example: midtrans }
        reference_no:
          type: string
          description: |
            The gateway's own identifier. Absent while PayMux does not yet know
            whether the payout was accepted.
        beneficiary_id: { type: string }
        beneficiary_name:
          type: string
          description: |
            A copy of the destination as it was when the payout was requested.
            Editing the address book later does not rewrite where money went.
        beneficiary_account: { type: string }
        beneficiary_bank: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        notes: { type: string }
        status:
          type: string
          enum: [REQUESTED, APPROVED, SUBMITTED, UNRESOLVED, COMPLETED, FAILED, REJECTED]
          description: |
            `REQUESTED` waits on a person and has moved nothing. `APPROVED` is
            released but not yet sent. `SUBMITTED` is with the gateway and can
            no longer be stopped. `UNRESOLVED` means PayMux sent it and cannot
            tell what happened, so the money may or may not be moving: do not
            re-issue it, because a replacement carries a new idempotency key
            and the gateway would treat it as a second instruction.
        gateway_status: { type: string }
        failure_code: { type: string }
        failure_reason: { type: string }
        reject_reason: { type: string }
        approved_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateSubscriptionRequest:
      type: object
      required: [name, amount, payment_token, interval_unit]
      properties:
        name: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, default: IDR }
        payment_type: { type: string, default: credit_card }
        payment_token:
          type: string
          description: |
            A gateway-issued token. PayMux never accepts or stores raw card
            details.
        interval_unit: { type: string, enum: [day, week, month] }
        interval_count: { type: integer, minimum: 1, default: 1 }
        max_interval: { type: integer }
        start_time: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/Customer" }
        metadata: { type: object, additionalProperties: true }
        gateway_options: { $ref: "#/components/schemas/GatewayOptions" }

    UpdateSubscriptionRequest:
      type: object
      description: Only the supplied fields change.
      properties:
        name: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
        interval_unit: { type: string, enum: [day, week, month] }
        interval_count: { type: integer, minimum: 1 }
        payment_token: { type: string }
        gateway_options: { $ref: "#/components/schemas/GatewayOptions" }

    Subscription:
      type: object
      properties:
        id: { type: string, example: sub_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: subscription }
        application_id: { type: string }
        gateway: { type: string }
        gateway_subscription_id: { type: string }
        name: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, CANCELED] }
        gateway_status: { type: string }
        interval_unit: { type: string }
        interval_count: { type: integer }
        max_interval: { type: integer }
        start_time: { type: string, format: date-time }
        payment_type: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EventPayload:
      type: object
      description: The body PayMux delivers to a webhook destination.
      properties:
        id: { type: string, example: evt_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        type: { $ref: "#/components/schemas/EventType" }
        gateway: { type: string }
        application_id: { type: string }
        payment_id: { type: string }
        refund_id: { type: string }
        subscription_id: { type: string }
        application_order_id: { type: string }
        gateway_order_id: { type: string }
        gateway_transaction_id: { type: string }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        gateway_status: { type: string }
        fraud_status: { type: string }
        payment_type: { type: string }
        amount: { type: integer, format: int64 }
        refunded_amount: { type: integer, format: int64 }
        currency: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        gateway_data:
          type: object
          description: The gateway's own payload, with secrets removed.
          additionalProperties: true

    Event:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: event }
        type: { $ref: "#/components/schemas/EventType" }
        gateway: { type: string }
        application_id: { type: string }
        payment_id: { type: string }
        refund_id: { type: string }
        subscription_id: { type: string }
        payout_id: { type: string }
        gateway_event_id: { type: string }
        data: { $ref: "#/components/schemas/EventPayload" }
        created_at: { type: string, format: date-time }

    Delivery:
      type: object
      properties:
        id: { type: string, example: dlv_01ARZ3NDEKTSV4RRFFQ69G5FAV }
        object: { type: string, const: delivery }
        event_id: { type: string }
        application_id: { type: string }
        destination_id: { type: string }
        url: { type: string }
        state: { $ref: "#/components/schemas/DeliveryState" }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time }
        last_status_code: { type: integer }
        last_error: { type: string }
        last_duration_ms: { type: integer }
        succeeded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Capabilities:
      type: object
      properties:
        gateway: { type: string }
        environment: { type: string, enum: [sandbox, production] }
        client_key:
          type: string
          description: |
            Names the merchant to the gateway's checkout script. Safe to put in
            a page: it authorises nothing on its own.
          example: SB-Mid-client-abc123
        checkout_script_url:
          type: string
          description: |
            The browser script that renders the gateway's checkout in place,
            for applications that would rather show a dialog than send the
            customer away. Reported here so an application never hardcodes a
            gateway hostname that changes with the environment.
          example: https://app.sandbox.midtrans.com/snap/snap.js
        capabilities:
          type: object
          properties:
            checkout: { type: boolean }
            refund: { type: boolean }
            partial_refund: { type: boolean }
            subscriptions: { type: boolean }
            cancel: { type: boolean }
            expire: { type: boolean }
            disbursement:
              type: boolean
              description: |
                False until the account holds disbursement credentials,
                whatever the adapter is capable of.

    ListEnvelope:
      type: object
      properties:
        has_more:
          type: boolean
          description: Whether a further page exists.
        limit: { type: integer }

    PaymentList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Payment" }

    RefundList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Refund" }

    SubscriptionList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Subscription" }

    EventList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Event" }

    DeliveryList:
      allOf:
        - $ref: "#/components/schemas/ListEnvelope"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Delivery" }
