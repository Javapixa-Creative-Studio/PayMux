name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"
  # Must stay on the v2 line: .golangci.yml uses the v2 config format.
  GOLANGCI_VERSION: "2.13.1"
  # golangci-lint v2.13 is built with a newer toolchain than the module
  # requires. Only the lint job needs it; everything else builds PayMux with
  # the version go.mod declares.
  GOLANGCI_GO_VERSION: "1.26"

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GOLANGCI_GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l apps examples internal migrations)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet $(go list ./... | grep -v node_modules)

      # Installed from the module rather than through the action, so CI runs
      # the exact binary contributors run locally. The version is pinned
      # because .golangci.yml uses the v2 configuration format, which the v1
      # line cannot parse — a silent major-version bump would break the job.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_VERSION }}

      - name: golangci-lint
        run: golangci-lint run ./...

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    # The integration tests need a real PostgreSQL: the properties they cover —
    # idempotency, isolation, concurrent state transitions — live in database
    # constraints that a fake cannot reproduce.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paymux
          POSTGRES_PASSWORD: paymux
          POSTGRES_DB: paymux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit and integration tests
        env:
          PAYMUX_TEST_DATABASE_URL: postgres://paymux:paymux@localhost:5432/paymux_test?sslmode=disable
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v node_modules)

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go build -trimpath -o bin/paymux-api ./apps/api
      - run: go build -trimpath -o bin/paymux-worker ./apps/worker

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  midtrans-sandbox:
    name: Midtrans sandbox
    runs-on: ubuntu-latest

    # Gated on the secret being present, so forks and pull requests from
    # outside the repository skip it rather than failing. Never point these at
    # production credentials: the tests create real transactions.
    if: github.event_name == 'push'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paymux
          POSTGRES_PASSWORD: paymux
          POSTGRES_DB: paymux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paymux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the sandbox tests
        env:
          PAYMUX_TEST_DATABASE_URL: postgres://paymux:paymux@localhost:5432/paymux_test?sslmode=disable
          MIDTRANS_SANDBOX_SERVER_KEY: ${{ secrets.MIDTRANS_SANDBOX_SERVER_KEY }}
          MIDTRANS_SANDBOX_CLIENT_KEY: ${{ secrets.MIDTRANS_SANDBOX_CLIENT_KEY }}
          MIDTRANS_SANDBOX_MERCHANT_ID: ${{ secrets.MIDTRANS_SANDBOX_MERCHANT_ID }}
        run: |
          if [ -z "$MIDTRANS_SANDBOX_SERVER_KEY" ]; then
            echo "No sandbox credentials configured; the tests will skip."
          fi
          go test -count=1 -v -run TestSandbox ./internal/integration/...

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the images assemble on every change.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/worker.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/dashboard.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
