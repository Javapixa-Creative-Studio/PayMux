# Security headers, included into every location that sets a header of its own.
#
# nginx does not merge add_header across configuration levels: a location
# containing any add_header discards every add_header inherited from the
# server block. Declaring these once at server level therefore leaves them off
# exactly the responses that set Cache-Control -- including the entry
# document, which is the one that most needs X-Frame-Options.
#
# Kept outside conf.d/ on purpose: nginx.conf globs conf.d/*.conf into the
# http block, and this file is meant to be included deliberately, not once
# more at a level where it would not apply.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
