server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One page, and it is the whole site. Five minutes keeps a repeat visit
    # cheap without making a redeploy invisible for an hour.
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }

    # No Content-Security-Policy here on purpose: the page pulls its typefaces
    # from Google Fonts and computes HMACs with the Web Crypto API, and a
    # policy tight enough to be worth having would have to allow both anyway.

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
