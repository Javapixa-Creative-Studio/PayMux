# PayMux: API, worker and dashboard.
#
# This file does not start a database. Point DATABASE_URL at the PostgreSQL you
# already run, which is the common case for anything past a laptop. If you want
# compose to run one for you, layer the companion file on top:
#
#   docker compose up -d                      # your own PostgreSQL
#   make up-postgres                          # a PostgreSQL container as well
#
# `make ports` prints where each service listens, which is what you need when
# binding domains on a host like Easypanel, Coolify or a plain reverse proxy.
name: paymux

services:
  api:
    build:
      context: .
      dockerfile: deployments/api.Dockerfile
    restart: unless-stopped
    environment:
      PAYMUX_ENV: ${PAYMUX_ENV:-development}
      PAYMUX_HTTP_ADDR: ":8080"
      PAYMUX_BASE_URL: ${PAYMUX_BASE_URL:-http://localhost:8080}
      PAYMUX_LOG_LEVEL: ${PAYMUX_LOG_LEVEL:-info}
      # Your database. Empty here on purpose: docker-compose.postgres.yml
      # overrides it when compose is the one running PostgreSQL. A managed
      # instance usually wants ?sslmode=require rather than disable.
      DATABASE_URL: ${DATABASE_URL:-}
      PAYMUX_ENCRYPTION_KEY: ${PAYMUX_ENCRYPTION_KEY:?set PAYMUX_ENCRYPTION_KEY in .env}
      PAYMUX_ADMIN_EMAIL: ${PAYMUX_ADMIN_EMAIL:-}
      PAYMUX_ADMIN_PASSWORD: ${PAYMUX_ADMIN_PASSWORD:-}
      PAYMUX_CORS_ORIGINS: ${PAYMUX_CORS_ORIGINS:-http://localhost:5173}
      PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS: ${PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS:-false}
    ports:
      - "${PAYMUX_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/paymux-api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: deployments/worker.Dockerfile
    restart: unless-stopped
    environment:
      PAYMUX_ENV: ${PAYMUX_ENV:-development}
      PAYMUX_LOG_LEVEL: ${PAYMUX_LOG_LEVEL:-info}
      # Your database. Empty here on purpose: docker-compose.postgres.yml
      # overrides it when compose is the one running PostgreSQL. A managed
      # instance usually wants ?sslmode=require rather than disable.
      DATABASE_URL: ${DATABASE_URL:-}
      PAYMUX_ENCRYPTION_KEY: ${PAYMUX_ENCRYPTION_KEY:?set PAYMUX_ENCRYPTION_KEY in .env}
      PAYMUX_WORKER_CONCURRENCY: ${PAYMUX_WORKER_CONCURRENCY:-20}
      PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS: ${PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS:-false}
      PAYMUX_METRICS_ADDR: ":9090"
    healthcheck:
      # The worker serves /health beside its metrics, so an unhealthy worker
      # is visible rather than silently draining nothing.
      test: ["CMD", "/paymux-worker", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  dashboard:
    build:
      context: .
      dockerfile: deployments/dashboard.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PAYMUX_DASHBOARD_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Landing page.
  #
  # The public marketing page, which has nothing to do with running PayMux.
  # Opt in with `docker compose --profile landing up`, or deploy it on its own
  # from deployments/landing.Dockerfile.
  # ---------------------------------------------------------------------------

  landing:
    profiles: ["landing"]
    build:
      context: .
      dockerfile: deployments/landing.Dockerfile
    restart: unless-stopped
    ports:
      - "${PAYMUX_LANDING_PORT:-7881}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Demo storefronts.
  #
  # Two shops, one image, one merchant account. They exist to make PayMux's
  # premise visible: each has its own API key, its own signing secret and its
  # own order book, and neither can see the other's payments.
  #
  # Opt in with `docker compose --profile demo up`, because a payment gateway
  # should not start two shops unless somebody asked for them.
  # ---------------------------------------------------------------------------

  shop-coffee:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: deployments/demo-shop.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SHOP_NAME: Kopi Rakyat
      SHOP_TAGLINE: Single-origin beans, roasted weekly
      SHOP_CATALOGUE: coffee
      SHOP_ACCENT: "#b4541f"
      # The two shops deliberately differ here: one keeps the customer on the
      # page, the other sends them to the gateway and back. Both are supported
      # and the choice belongs to the shop.
      SHOP_CHECKOUT: ${SHOP_A_CHECKOUT:-popup}
      SHOP_ADDR: ":9911"
      # Reached from inside the compose network, not from the browser.
      PAYMUX_URL: http://api:8080
      PAYMUX_API_KEY: ${SHOP_A_API_KEY:-}
      PAYMUX_WEBHOOK_SECRET: ${SHOP_A_WEBHOOK_SECRET:-}
    ports:
      - "${SHOP_A_PORT:-9911}:9911"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9911/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  shop-books:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: deployments/demo-shop.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SHOP_NAME: Margin Notes
      SHOP_TAGLINE: Second-hand books, first-rate condition
      SHOP_CATALOGUE: books
      SHOP_ACCENT: "#2f6f5e"
      SHOP_CHECKOUT: ${SHOP_B_CHECKOUT:-redirect}
      SHOP_ADDR: ":9921"
      PAYMUX_URL: http://api:8080
      PAYMUX_API_KEY: ${SHOP_B_API_KEY:-}
      PAYMUX_WEBHOOK_SECRET: ${SHOP_B_WEBHOOK_SECRET:-}
    ports:
      - "${SHOP_B_PORT:-9921}:9921"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9921/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
