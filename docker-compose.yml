name: paymux

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paymux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paymux}
      POSTGRES_DB: ${POSTGRES_DB:-paymux}
    # Deliberately not published. The database is reachable on the compose
    # network by the services that need it; exposing it on the host is a
    # development convenience that becomes an attack surface in production.
    # Set POSTGRES_PORT and uncomment to reach it with psql locally.
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paymux} -d ${POSTGRES_DB:-paymux}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployments/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYMUX_ENV: ${PAYMUX_ENV:-development}
      PAYMUX_HTTP_ADDR: ":8080"
      PAYMUX_BASE_URL: ${PAYMUX_BASE_URL:-http://localhost:8080}
      PAYMUX_LOG_LEVEL: ${PAYMUX_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-paymux}:${POSTGRES_PASSWORD:-paymux}@postgres:5432/${POSTGRES_DB:-paymux}?sslmode=disable
      PAYMUX_ENCRYPTION_KEY: ${PAYMUX_ENCRYPTION_KEY:?set PAYMUX_ENCRYPTION_KEY in .env}
      PAYMUX_ADMIN_EMAIL: ${PAYMUX_ADMIN_EMAIL:-}
      PAYMUX_ADMIN_PASSWORD: ${PAYMUX_ADMIN_PASSWORD:-}
      PAYMUX_CORS_ORIGINS: ${PAYMUX_CORS_ORIGINS:-http://localhost:5173}
      PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS: ${PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS:-false}
    ports:
      - "${PAYMUX_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/paymux-api", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: deployments/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PAYMUX_ENV: ${PAYMUX_ENV:-development}
      PAYMUX_LOG_LEVEL: ${PAYMUX_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-paymux}:${POSTGRES_PASSWORD:-paymux}@postgres:5432/${POSTGRES_DB:-paymux}?sslmode=disable
      PAYMUX_ENCRYPTION_KEY: ${PAYMUX_ENCRYPTION_KEY:?set PAYMUX_ENCRYPTION_KEY in .env}
      PAYMUX_WORKER_CONCURRENCY: ${PAYMUX_WORKER_CONCURRENCY:-20}
      PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS: ${PAYMUX_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS:-false}
      PAYMUX_METRICS_ADDR: ":9090"
    healthcheck:
      # The worker serves /health beside its metrics, so an unhealthy worker
      # is visible rather than silently draining nothing.
      test: ["CMD", "/paymux-worker", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  dashboard:
    build:
      context: .
      dockerfile: deployments/dashboard.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PAYMUX_DASHBOARD_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres-data:
